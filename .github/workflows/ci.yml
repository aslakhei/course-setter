name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # version from packageManager in package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Database and storage tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Google sign-in is configured in supabase/config.toml but not exercised in CI.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci-not-used
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci-not-used
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (only the services the tests need)
        run: pnpm exec supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Database tests (row-level security, job queue)
        run: pnpm db:test
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t course-setter-worker .
      # On the Supabase Docker network the database reaches the worker by container name, as it reaches
      # Cloud Run in production.
      - name: Start worker container
        run: |
          echo "JOB_WORKER_SECRET=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"
          docker run -d --name worker --network supabase_network_course-setter \
            -e SUPABASE_URL=http://supabase_kong_course-setter:8000 \
            -e SUPABASE_SECRET_KEY="$(pnpm exec supabase status -o json 2>/dev/null | sed -n '/^{/,$p' | jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY')" \
            -e WORKER_SECRET="$JOB_WORKER_SECRET" \
            course-setter-worker
      - name: Integration tests (storage range requests, job queue through the worker container)
        run: pnpm test:integration
        env:
          JOB_WORKER_URL: http://worker:8080/jobs/run
      - name: Worker logs
        if: always()
        run: docker logs worker || true
      - name: Install Chromium for end-to-end tests
        run: pnpm --filter @course-setter/web exec playwright install --with-deps chromium
      - name: End-to-end tests (web app against local Supabase)
        run: pnpm test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
      - name: Generated database types are up to date
        run: |
          pnpm db:types
          git diff --exit-code apps/web/src/lib/database.types.ts
