name: Deploy

# main: apply database migrations to the hosted Supabase project, then deploy the worker to Cloud Run and
# the web app to production.
# Pull requests: dry-run the migrations, then deploy a preview of the web app (https://<branch>.course-setter.pages.dev).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  database:
    name: Apply database migrations
    # Pull requests do a dry run against the hosted project (same token and connection, no changes).
    # Skipped for pull requests from forks, which get no secrets.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref ${{ vars.SUPABASE_PROJECT_REF }}
      # The CLI targets the local stack by default; --remote targets the linked project.
      # Hosted changes need --yes when there is no terminal to confirm in.
      - name: Check pending migrations
        if: github.event_name == 'pull_request'
        run: pnpm exec supabase db push --remote --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: github.event_name == 'push'
        run: pnpm exec supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

  worker:
    name: Deploy worker
    needs: database
    # main only, after migrations, and only once Google Cloud is set up (repository variable GCP_PROJECT_ID).
    if: github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Workload Identity Federation: GitHub's OIDC token is exchanged for short-lived Google credentials
    env:
      IMAGE: europe-north1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/course-setter/worker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Build and push image
        run: |
          gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet
          docker build -f apps/worker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
      # Public URL: the database calls it over the internet; requests without the shared secret get 401.
      # Scales to zero; the timeout covers the longest job, since the worker answers when the queue is drained.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy worker \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region europe-north1 \
            --image "$IMAGE" \
            --service-account "${{ vars.GCP_WORKER_SERVICE_ACCOUNT }}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --cpu 1 \
            --memory 1Gi \
            --timeout 900 \
            --set-env-vars "SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}" \
            --set-secrets "SUPABASE_SECRET_KEY=supabase-secret-key:latest,WORKER_SECRET=worker-secret:latest"

  web:
    name: Deploy web app
    needs: database
    # Runs after migrations on main, and on its own for pull requests (where `database` is skipped).
    if: ${{ !cancelled() && (needs.database.result == 'success' || needs.database.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @course-setter/web build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/web/dist --project-name=course-setter --branch="$BRANCH"
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
